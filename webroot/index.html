<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>NEXUS // AI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="logo"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.5"/><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg></div>
    <div><div class="title">NEXUS <span>//</span> AI</div><div class="sub" id="subline">Loading...</div></div>
  </div>
  <select id="modelSel" class="pill"></select>
</header>

<main>
  <!-- CHAT -->
  <section class="tab active" id="tab-chat">
    <div id="messages" class="msgs"></div>
    <div class="inputbar">
      <textarea id="msgInput" rows="1" placeholder="Message..."></textarea>
      <button class="send" id="sendBtn"><svg viewBox="0 0 24 24"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7Z"/></svg></button>
    </div>
  </section>

  <!-- PROVIDERS -->
  <section class="tab" id="tab-providers">
    <p class="hint">Add your API keys here. Keys are stored in a root-only file on the device, not in the browser.</p>
    <div id="provList"></div>
    <div class="box" style="margin-top:12px">
      <h3>Add provider</h3>
      <div class="form">
        <select id="newType" class="f">
          <option value="openai">OpenAI</option>
          <option value="anthropic">Anthropic</option>
          <option value="gemini">Google Gemini</option>
          <option value="deepseek">DeepSeek</option>
          <option value="mistral">Mistral</option>
          <option value="xai">xAI (Grok)</option>
          <option value="groq">Groq</option>
          <option value="openrouter">OpenRouter</option>
          <option value="custom">Custom (OpenAI-compatible)</option>
        </select>
        <input class="f" id="newName" placeholder="Display name (optional)">
        <input class="f" id="newBase" placeholder="Base URL">
        <input class="f" id="newKey" placeholder="API key" type="password">
        <button class="primary" id="addProv" style="width:100%">Save provider</button>
      </div>
    </div>
  </section>

  <!-- HISTORY -->
  <section class="tab" id="tab-history">
    <p class="hint">Saved conversations. Tap one to continue it.</p>
    <div id="histList" class="list"></div>
  </section>

  <!-- GITHUB -->
  <section class="tab" id="tab-github">
    <div class="box">
      <h3>GitHub</h3>
      <p class="hint">Enter a personal access token to browse your repos, issues and PRs, and review them with the active AI model.</p>
      <div class="form">
        <input class="f" id="ghToken" placeholder="ghp_... or github_pat_..." type="password">
        <button class="ghost" id="ghSave" style="width:100%">Save token</button>
      </div>
    </div>
    <div id="ghContent"></div>
  </section>

  <!-- SETTINGS -->
  <section class="tab" id="tab-settings">
    <div id="settingsBox"></div>
  </section>
</main>

<nav class="bottom">
  <button data-tab="chat" class="on"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10Z"/></svg>Chat</button>
  <button data-tab="providers"><svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M13 12H3"/></svg>Providers</button>
  <button data-tab="history"><svg viewBox="0 0 24 24"><path d="M12 8v5l3 2M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>History</button>
  <button data-tab="github"><svg viewBox="0 0 24 24"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.9a3.4 3.4 0 0 0-1-2.6c3.2-.4 6.5-1.6 6.5-7A5.4 5.4 0 0 0 20 4.8 5 5 0 0 0 19.8 1s-1.3-.4-4.3 1.7a14.7 14.7 0 0 0-7 0C5.5.6 4.2 1 4.2 1a5 5 0 0 0-.2 3.8 5.4 5.4 0 0 0-1.5 3.7c0 5.4 3.3 6.6 6.5 7a3.4 3.4 0 0 0-1 2.6V22"/></svg>GitHub</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="8" cy="18" r="2"/></svg>Settings</button>
</nav>

<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
